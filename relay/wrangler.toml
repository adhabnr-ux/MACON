# Deploy:  cd relay && npx wrangler@4 deploy && npx wrangler@4 secret bulk secrets.json
name = "macon-relay"
main = "worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "STATE"
class_name = "MaconState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MaconState"]
